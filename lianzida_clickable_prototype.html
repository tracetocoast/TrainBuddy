<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>练搭子｜交互原型</title>
<style>
:root{--lime:#c8ff36;--ink:#151812;--paper:#f5f6f0;--muted:#74796d;--line:#e4e7dd;--purple:#9b7cff}
*{box-sizing:border-box}body{margin:0;background:#e8eae3;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;gap:24px;justify-content:center;padding:24px}.phone{width:390px;min-height:820px;background:var(--paper);border:8px solid #171914;border-radius:40px;overflow:hidden;position:relative;box-shadow:0 20px 55px #1113}.status{height:30px;padding:7px 22px 0;font-size:11px;font-weight:800;display:flex;justify-content:space-between}.app{padding-bottom:82px;min-height:790px}.top{padding:12px 19px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:1000;letter-spacing:-1px}.mark{display:inline-grid;place-items:center;width:27px;height:27px;border-radius:9px;background:var(--lime);margin-right:7px;transform:rotate(-7deg)}.role{display:flex;margin:0 19px 15px;padding:4px;background:#e6e9df;border-radius:13px}.role button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;font-size:12px;font-weight:850;color:#757a6d}.role button.on{background:white;color:#151812}.page{padding:0 19px}.eyebrow{font-size:10px;font-weight:900;letter-spacing:1.6px;color:#73786d}.title{font-size:31px;line-height:1.05;letter-spacing:-1.4px;font-weight:1000;margin:8px 0 13px}.sub{font-size:12px;line-height:1.55;color:var(--muted)}.hero{background:#151812;color:white;border-radius:25px;padding:18px;min-height:205px;position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:170px;height:170px;border:1px solid #c8ff3640;border-radius:50%;right:-35px;top:28px;box-shadow:0 0 0 18px #c8ff3610,0 0 0 36px #c8ff3608}.pill{background:var(--lime);color:#151812;border-radius:50px;padding:6px 9px;font-size:9px;font-weight:950;letter-spacing:.5px;display:inline-block}.hero h2{font-size:26px;line-height:1.05;letter-spacing:-1px;margin:21px 0 7px;position:relative;z-index:1}.hero .sub{color:#c4c9bb;position:relative;z-index:1}.herofoot{display:flex;justify-content:space-between;align-items:end;margin-top:16px;position:relative;z-index:1}.big{font-size:36px;font-weight:1000;letter-spacing:-2px}.primary{background:var(--lime);border:0;border-radius:13px;padding:12px 14px;font-size:12px;font-weight:950;box-shadow:0 3px 0 #85b900}.secondary{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:11px;font-weight:850}.darkbtn{background:#242a20;border:1px solid #434b3b;color:white;border-radius:12px;padding:11px 12px;font-size:11px;font-weight:850}.head{display:flex;align-items:center;justify-content:space-between;margin:21px 0 10px}.head h2{font-size:19px;letter-spacing:-.5px;margin:0;font-weight:950}.link{border:0;background:transparent;color:#59770b;font-size:11px;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:12px 10px}.stat strong{font-size:22px;letter-spacing:-1px;display:block}.stat span{font-size:10px;color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px;margin-top:8px}.flex{display:flex;align-items:center;gap:11px}.grow{flex:1;min-width:0}.ico{width:48px;height:50px;border-radius:14px;background:#eaf8cb;display:grid;place-items:center;font-size:22px;flex-shrink:0}.card h3{font-size:13px;margin:0 0 5px;font-weight:900}.tag{font-size:9px;font-weight:900;background:#eef0e9;border-radius:7px;padding:4px 6px;color:#62685b;display:inline-block}.nav{position:absolute;bottom:0;left:0;right:0;height:74px;background:white;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:6px 5px max(6px,env(safe-area-inset-bottom))}.nav button{border:0;background:transparent;color:#8b9084;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:9px;font-weight:850;min-width:53px}.nav button b{font-size:19px;line-height:1}.nav button.active{color:#151812}.nav button.active b{background:var(--lime);padding:5px 9px;border-radius:10px;margin-top:-5px}.dates{display:flex;gap:6px;overflow:auto;margin:13px 0}.dates button{min-width:43px;border:1px solid var(--line);background:white;border-radius:12px;padding:9px 3px;color:#777c71;font-size:10px}.dates b{display:block;font-size:16px;margin-top:4px;color:#151812}.dates .chosen{background:var(--lime);border-color:var(--lime)}.time{font-size:18px;font-weight:1000;width:61px}.slot{display:flex;align-items:center;gap:10px}.slotmain{flex:1}.slotmain h3{margin:0 0 4px;font-size:13px}.slotmain p{margin:0;font-size:10px;color:var(--muted)}.statuspill{font-size:9px;font-weight:900;border-radius:7px;padding:5px 7px;background:#edf7d7}.field{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:12px;outline:none}.field:focus{border-color:#9fca2c;box-shadow:0 0 0 3px #c8ff3638}textarea{resize:vertical}.exercise{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:9px}.setgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:11px}.set{background:#f2f4ed;border-radius:9px;text-align:center;padding:8px 3px}.set small{display:block;font-size:9px;color:var(--muted);margin-bottom:4px}.set b{font-size:13px}.done{background:#20251b!important;color:white}.progress{height:7px;background:#e5e8de;border-radius:9px;overflow:hidden}.progress i{display:block;background:#a6e61b;height:100%;border-radius:9px}.ai{margin:0 -19px;background:#111610;color:white;padding:4px 19px 22px;min-height:590px}.ai .eyebrow{color:#bdc7ae}.ai .sub{color:#bfc7b5}.aibox{background:#1b2119;border:1px solid #394333;border-radius:20px;padding:14px;margin-top:14px}.scan{height:225px;margin-top:12px;border-radius:15px;position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(ellipse,#39482e,#1c2619 60%,#151a14)}.scan:before{content:"";position:absolute;inset:17px;border:1px solid #c8ff3644;border-radius:45% 45% 40% 40%}.scan:after{content:"";position:absolute;left:12%;right:12%;height:1px;background:var(--lime);box-shadow:0 0 15px 3px #c8ff3680;animation:sweep 2.7s ease-in-out infinite alternate}@keyframes sweep{from{top:22%}to{top:78%}}.silhouette{font-size:102px;filter:drop-shadow(0 0 14px #c8ff3655)}.scanlabel{position:absolute;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:9px;letter-spacing:1px;color:#d6e8c1}.aimetrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.aimetrics .stat{background:#22291f;border-color:#394333}.aimetrics .stat strong{color:var(--lime)}.aimetrics .stat span{color:#b7c1ad}.note{margin-top:12px;padding:10px;border-left:3px solid var(--lime);border-radius:0 10px 10px 0;background:#242d20;color:#d4ddca;font-size:11px;line-height:1.6}.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.toast{position:absolute;z-index:30;bottom:86px;left:50%;transform:translate(-50%,12px);opacity:0;pointer-events:none;transition:.2s;background:#171914;color:white;border-radius:12px;padding:11px 14px;font-size:11px;font-weight:850;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.backdrop{display:none;position:absolute;inset:0;background:#1118;z-index:20;align-items:flex-end}.backdrop.show{display:flex}.sheet{background:var(--paper);border-radius:23px 23px 0 0;padding:20px;width:100%;animation:rise .2s ease}.grip{width:35px;height:4px;background:#d3d7cc;border-radius:8px;margin:0 auto 16px}@keyframes rise{from{transform:translateY(35px)}to{transform:translateY(0)}}.sheet h2{font-size:20px;margin:0 0 8px}.sheet p{font-size:12px;line-height:1.6;color:var(--muted)}.sheet .primary{width:100%;margin:15px 0 8px}.side{max-width:300px;align-self:center;background:white;border-radius:22px;padding:22px;box-shadow:0 15px 40px #1111}.side h2{line-height:1.15}.side p,.side li{font-size:12px;line-height:1.8;color:#656b5e}.side .eyebrow{margin-bottom:10px}
@media(max-width:600px){body{background:var(--paper)}.layout{display:block;padding:0}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}.app{min-height:calc(100vh - 30px)}.side{display:none}}
</style></head><body><div class="layout"><div class="phone"><div class="status"><span>9:41</span><span>●●● ▰ 100%</span></div><div class="app"><header class="top"><div class="brand"><span class="mark">↗</span>练搭子 <small style="font-size:8px;letter-spacing:1px;color:#7c8175">TRAIN BUDDY</small></div><button class="secondary" onclick="toast('暂时没有新消息')">♧</button></header><div class="role"><button id="srole" class="on" onclick="setRole('student')">我是学员</button><button id="crole" onclick="setRole('coach')">我是教练</button></div><main class="page" id="page"></main><nav class="nav" id="nav"></nav><div class="toast" id="toast"></div><div class="backdrop" id="backdrop" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div></div></div><aside class="side"><div class="eyebrow">CLICKABLE PROTOTYPE · V1</div><h2>练搭子<br>把训练变成习惯。</h2><p>可交互的手机端原型，支持切换学员/教练身份，体验约课、训练打卡、课后记录与 AI 体态分析。</p><ul><li>底部导航切换主要页面</li><li>预约、完成组数、保存记录均可操作</li><li>AI 扫描是演示动效，不是真实分析</li><li>无真实账号、云端数据或微信 API</li></ul><p><b>建议体验：</b>学员首页 → 约课 → 训练 → AI 体态 → 教练工作台 → 课后记录。</p></aside></div>
<script>
const S={role:'student',tab:'home',booked:'',sets:0,checkins:0,records:[],date:2,student:'陈佳宁'};
const navs={student:[['home','⌂','今天'],['booking','▦','约课'],['workout','↗','训练'],['ai','◉','AI体态'],['growth','✳','成长']],coach:[['home','⌂','工作台'],['booking','▦','排课'],['record','✎','课后记录'],['students','♧','学员'],['ai','◉','AI工具']]};
function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2200)}
function setRole(r){S.role=r;S.tab='home';document.querySelector('#srole').classList.toggle('on',r==='student');document.querySelector('#crole').classList.toggle('on',r==='coach');render()}
function go(t){S.tab=t;render()}
function openSheet(title,desc,content='',btn='确认'){document.querySelector('#sheet').innerHTML=`<div class="grip"></div><h2>${title}</h2><p>${desc}</p>${content}<button class="primary" onclick="closeSheet();toast('操作已完成')">${btn}</button>`;document.querySelector('#backdrop').classList.add('show')}
function closeSheet(){document.querySelector('#backdrop').classList.remove('show')}
function render(){document.querySelector('#nav').innerHTML=navs[S.role].map(n=>`<button class="${S.tab===n[0]?'active':''}" onclick="go('${n[0]}')"><b>${n[1]}</b><span>${n[2]}</span></button>`).join('');let p=document.querySelector('#page');let fn={home:S.role==='student'?studentHome:coachHome,booking:booking,workout:workout,ai:ai,growth:growth,record:record,students:students}[S.tab];p.innerHTML=fn?fn():studentHome()}
function studentHome(){return `<div class="eyebrow">WEDNESDAY · YOUR DAY</div><div class="title">今天也要<br>练得漂亮。</div><div class="hero"><span class="pill">WEEK 04 · BUILD MODE</span><h2>你的节奏，<br>由你定义。</h2><p class="sub">稳定训练，比完美计划更重要。</p><div class="herofoot"><div><div class="big">${3+S.checkins}<span style="font-size:13px;color:var(--lime)"> DAYS</span></div><div class="sub">连续训练记录</div></div><button class="primary" onclick="go('workout')">开始今日训练 ↗</button></div></div><div class="head"><h2>本周状态</h2><button class="link" onclick="go('growth')">查看成长 ↗</button></div><div class="stats"><div class="stat"><strong>${4+S.checkins}</strong><span>本周训练 / 次</span></div><div class="stat"><strong>86%</strong><span>计划完成率</span></div><div class="stat"><strong>+12%</strong><span>力量进步</span></div></div><div class="head"><h2>今天的任务</h2><span class="tag">COACH PICK</span></div><div class="card flex"><div class="ico">🏋️</div><div class="grow"><h3>下肢力量 · A 计划</h3><p class="sub">45 分钟 · 5 个动作 · 林野教练</p><span class="tag">深蹲</span> <span class="tag">臀腿</span></div><button class="primary" onclick="go('workout')">开练</button></div><div class="head"><h2>下一次约课</h2><button class="link" onclick="go('booking')">全部课程 ↗</button></div><div class="card flex"><div class="ico" style="background:#e8e0ff">◷</div><div class="grow"><h3>${S.booked||'周五 18:30'} · 私教训练</h3><p class="sub">林野教练 · 力量进阶</p></div><span class="tag">已预约</span></div>`}
function coachHome(){return `<div class="eyebrow">COACH MODE · TODAY</div><div class="title">今天，带他们<br>再进步一点。</div><div class="hero"><span class="pill">YOUR STUDIO</span><h2>把时间留给<br>真正重要的指导。</h2><p class="sub">训练记录、学员状态，一眼掌握。</p><div class="herofoot"><div><div class="big">06<span style="font-size:13px;color:var(--lime)"> SESSIONS</span></div><div class="sub">今日课程安排</div></div><button class="primary" onclick="go('record')">记录一节课 ↗</button></div></div><div class="head"><h2>今日安排</h2><button class="link" onclick="go('booking')">查看排课 ↗</button></div>${[['09:00','陈佳宁','上肢力量 · 第 8 次','已完成'],['11:30','周子墨','体态改善 · 第 3 次','待记录'],['18:30','许一诺','臀腿力量 · 第 12 次','即将开始']].map((x,i)=>`<div class="card"><div class="slot"><div class="time">${x[0]}</div><div class="slotmain"><h3>${x[1]}</h3><p>${x[2]}</p></div><span class="statuspill">${x[3]}</span></div><div class="head" style="margin:10px 0 0"><span class="sub">动作质量 · 稳定进阶</span><button class="secondary" onclick="S.student='${x[1]}';go('record')">${i===0?'查看记录':'课后记录'}</button></div></div>`).join('')}<div class="head"><h2>学员状态提醒</h2><span class="tag">2 ITEMS</span></div><div class="card flex"><div class="ico" style="background:#ffe5d5">!</div><div class="grow"><h3>周子墨 · 连续 5 天未打卡</h3><p class="sub">建议关怀提醒，确认训练安排。</p></div><button class="link" onclick="toast('已发送模拟提醒')">提醒</button></div>`}
function booking(){let d=[['周一','13'],['周二','14'],['周三','15'],['周四','16'],['周五','17'],['周六','18'],['周日','19']];return `<div class="eyebrow">${S.role==='student'?'FIND YOUR SESSION':'STUDIO SCHEDULE'}</div><div class="title">${S.role==='student'?'约一场，状态拉满。':'排课清晰，节奏在线。'}</div><p class="sub">${S.role==='student'?'选择适合你的时间，剩下的交给训练。':'查看可约时段，管理今日课程安排。'}</p><div class="head"><h2>10 月 · 本周</h2><span class="tag">2026</span></div><div class="dates">${d.map((x,i)=>`<button class="${S.date===i?'chosen':''}" onclick="S.date=${i};render()">${x[0]}<b>${x[1]}</b></button>`).join('')}</div><div class="head"><h2>可选时段</h2><span class="sub">教练 · 林野</span></div>${[['09:00','力量基础','45 分钟 · 入门友好','已约'],['11:00','体态与灵活性','50 分钟 · 体态改善','可预约'],['14:30','上肢力量','45 分钟 · 力量进阶','可预约'],['18:30','臀腿力量','60 分钟 · 热门时段','可预约']].map((x,i)=>`<div class="card"><div class="slot"><div class="time">${x[0]}</div><div class="slotmain"><h3>${x[1]}</h3><p>${x[2]}</p></div><span class="statuspill">${S.booked===x[0]?'已预约':x[3]}</span></div><div class="head" style="margin:10px 0 0"><span class="sub">私教工作室 · 可改期</span><button class="${i===0?'secondary':'primary'}" ${i===0?'disabled':''} onclick="book('${x[0]}','${x[1]}')">${S.booked===x[0]?'已预约':S.role==='student'?'预约课程':'添加排课'}</button></div></div>`).join('')}<p class="sub" style="margin-top:13px">预约成功后会同步到训练日程。此处使用模拟数据。</p>`}
function book(t,n){S.booked=t;openSheet('预约确认',`你选择了 ${t} 的「${n}」。确认后将加入训练日程。`,`<div class="card flex"><div class="ico">◷</div><div class="grow"><h3>${t} · ${n}</h3><p class="sub">林野教练 · 私教工作室</p></div></div>`,'确认预约');render()}
function workout(){let a=[['🏋️','杠铃深蹲','4 组 × 10 次','60 kg'],['🦵','罗马尼亚硬拉','3 组 × 10 次','40 kg'],['🍑','臀推','3 组 × 12 次','45 kg']];return `<div class="eyebrow">WORKOUT SESSION · A01</div><div class="title">下肢力量<br>开练。</div><p class="sub">目标：动作稳定、节奏可控。每完成一组，点击打卡。</p><div class="head"><h2>训练进度</h2><b>${Math.min(S.sets,10)}/10 组</b></div><div class="progress"><i style="width:${Math.min(S.sets/10*100,100)}%"></i></div>${a.map((x,i)=>`<div class="exercise"><div class="flex"><div class="ico">${x[0]}</div><div class="grow"><h3>${x[1]}</h3><p class="sub">${x[2]}</p></div><span class="tag">${x[3]}</span></div><div class="setgrid"><div class="set"><small>目标组数</small><b>${i===0?4:3} 组</b></div><div class="set"><small>每组次数</small><b>${i===2?12:10} 次</b></div><button class="primary ${S.sets>i?'done':''}" onclick="completeSet()"> ${S.sets>i?'✓ 已完成':'完成一组 +'}</button></div></div>`).join('')}<div class="card flex" style="margin-top:14px"><div class="grow"><h3>训练进行中</h3><p class="sub">已完成 ${S.sets} 组 · 记得保持呼吸</p></div><button class="primary" onclick="finish()">结束训练 ↗</button></div>`}
function completeSet(){S.sets=Math.min(10,S.sets+1);render();toast('漂亮！已记录一组 💪')}
function finish(){S.checkins++;S.records.push('下肢力量训练 · 完成 '+S.sets+' 组');openSheet('训练完成，今天又进步了。','本次训练记录已在原型中更新。你可以继续查看成长档案。',`<div class="stats"><div class="stat"><strong>45</strong><span>分钟</span></div><div class="stat"><strong>${S.sets}</strong><span>已记录组数</span></div><div class="stat"><strong>+1</strong><span>训练打卡</span></div></div><textarea class="field" style="margin-top:12px" placeholder="训练感受：状态不错，末组略吃力"></textarea>`,'保存训练小结');S.sets=0}
function ai(){return `<div class="ai"><div class="eyebrow">AI LAB · BODY INSIGHT</div><div class="title">看见姿态，<br>找到下一步。</div><p class="sub">用记录帮助你理解身体变化。AI 建议仅供训练参考。</p><div class="aibox"><span class="pill">POSTURE SCAN 01</span><h2 style="margin:12px 0 0">体态扫描</h2><div class="scan"><div class="silhouette">♙</div><div class="scanlabel"><span>BODY ALIGNMENT</span><span>READY TO SCAN</span></div></div><div class="twobtn"><button class="darkbtn" onclick="openSheet('拍摄正面照片','请自然站立，穿着便于观察轮廓的运动服，完整拍摄全身。','<div class=&quot;card flex&quot;><div class=&quot;ico&quot;>📷</div><div><h3>正面 · 自然站姿</h3><p class=&quot;sub&quot;>光线均匀，完整入镜</p></div></div>','模拟拍摄')">＋ 正面照片</button><button class="darkbtn" onclick="openSheet('拍摄侧面照片','侧身自然站立，双脚与髋同宽，避免刻意挺胸或收腹。','<div class=&quot;card flex&quot;><div class=&quot;ico&quot;>◐</div><div><h3>侧面 · 自然站姿</h3><p class=&quot;sub&quot;>全身入镜，背景简洁</p></div></div>','模拟拍摄')">＋ 侧面照片</button></div><button class="primary" style="width:100%;margin-top:10px" onclick="scan()">开始 AI 体态分析 ↗</button></div><div class="aimetrics"><div class="stat"><strong>82/100</strong><span>示例姿态参考分</span></div><div class="stat"><strong>03</strong><span>建议关注方向</span></div></div><div class="note">当前为原型示例数据，不是对真实身体的评估，也不能替代医生或专业康复人员诊断。</div><div class="head"><h2>阶段记录</h2><span class="tag">DEMO</span></div><div class="aibox"><h3>本阶段建议</h3><p class="sub">核心稳定 · 髋踝活动度 · 动作控制</p><button class="darkbtn" style="width:100%;margin-top:12px" onclick="toast('已打开示例阶段报告')">查看示例报告</button></div></div>`}
function scan(){toast('正在扫描姿态特征…');setTimeout(()=>openSheet('分析已完成 · 示例报告','以下结果仅用于演示页面交互，接入真实模型后才会生成个人分析。','<div class="aimetrics"><div class="stat"><strong>82/100</strong><span>参考分（示例）</span></div><div class="stat"><strong>3 项</strong><span>关注方向</span></div></div><div class="note">建议由教练结合动作表现复核，再制定适合你的训练计划。</div>','查看建议'),800)}
function growth(){return `<div class="eyebrow">YOUR PROGRESS · NOT PERFECTION</div><div class="title">每一次坚持，<br>都有迹可循。</div><div class="hero"><span class="pill">OCTOBER CHECK-IN</span><div class="herofoot" style="margin-top:27px"><div><div class="big">${12+S.checkins}<span style="font-size:13px;color:var(--lime)"> SESSIONS</span></div><div class="sub">本月累计训练</div></div><span style="font-size:35px">🏆</span></div></div><div class="head"><h2>本周训练节奏</h2><span class="tag">4 / 5 DAYS</span></div><div class="card" style="display:flex;align-items:end;gap:10px;height:135px">${[42,72,52,88,35,8,8].map((h,i)=>`<div style="flex:1;text-align:center"><div style="height:${h}px;background:${i<5?'#a6e61b':'#dce1d3'};border-radius:7px 7px 3px 3px;margin:auto;width:100%;max-width:25px"></div><small class="sub">${'一二三四五六日'[i]}</small></div>`).join('')}</div><div class="head"><h2>最近的里程碑</h2></div><div class="card flex"><div class="ico">⚡</div><div class="grow"><h3>连续打卡 7 天</h3><p class="sub">习惯正在形成，继续保持节奏。</p></div><span class="tag">已达成</span></div><div class="card flex"><div class="ico">🏋️</div><div class="grow"><h3>深蹲重量稳步提升</h3><p class="sub">下一步：优先保持动作质量。</p></div><span class="tag">成长中</span></div><div class="head"><h2>训练记录</h2><button class="link" onclick="go('workout')">继续训练 ↗</button></div>${S.records.slice(-3).reverse().map(x=>`<div class="card">${x}</div>`).join('')||'<p class="sub">完成一次训练后，你的记录会显示在这里。</p>'}`}
function record(){return `<div class="eyebrow">POST-SESSION · COACH NOTES</div><div class="title">下课别忙走，<br>记录交给我。</div><p class="sub">用语音或快速填写，生成学员看得懂、下次用得上的训练记录。</p><div class="head"><h2>选择学员</h2><span class="tag">TODAY</span></div><div class="dates">${['陈佳宁','周子墨','许一诺'].map(n=>`<button class="${S.student===n?'chosen':''}" onclick="S.student='${n}';render()">${n}</button>`).join('')}</div><div class="head"><h2>课后记录</h2><span class="sub">语音转结构化表格</span></div><div class="card flex"><div class="ico">🎙️</div><div class="grow"><h3>用语音快速记录</h3><p class="sub">例如：深蹲四组，每组十次，六十公斤。</p></div><button class="primary" onclick="voice()">模拟语音</button></div><label class="sub" style="display:block;margin:14px 0 6px">训练内容 / AI 整理结果</label><textarea id="recordtext" class="field" rows="4" placeholder="输入训练动作、组数、次数、重量和学员状态…"></textarea><div class="head"><h2>快速添加训练项</h2></div><div style="display:flex;gap:6px;flex-wrap:wrap">${['深蹲 4×10','硬拉 3×10','臀推 3×12','核心训练 3 组'].map(t=>`<button class="secondary" onclick="append('${t}')">＋ ${t}</button>`).join('')}</div><div class="head"><h2>教练点评</h2></div><textarea id="note" class="field" rows="2" placeholder="本次表现与下次训练重点…"></textarea><button class="primary" style="width:100%;margin-top:14px" onclick="saveRecord()">保存并同步给学员 ↗</button><p class="sub" style="margin-top:10px">演示版本只在当前页面状态中保存，不会真实发送消息。</p>`}
function voice(){document.querySelector('#recordtext').value='深蹲 4 组 × 10 次 · 60 kg\\n罗马尼亚硬拉 3 组 × 10 次 · 40 kg\\n臀推 3 组 × 12 次 · 45 kg\\n学员状态：动作整体稳定，最后一组略疲劳。';toast('已生成示例训练表，请教练核对')}
function append(t){let e=document.querySelector('#recordtext');e.value+=(e.value?'\\n':'')+t;toast('已添加训练项')}
function saveRecord(){let t=document.querySelector('#recordtext').value.trim();if(!t){toast('请先填写训练内容');return}let n=document.querySelector('#note').value;S.records.push(S.student+' · '+t.split('\\n')[0]);openSheet('训练记录已保存','原型已模拟保存记录并同步给学员。正式版需要接入后端、权限控制和消息通知。',`<div class="card"><h3>${S.student}</h3><p class="sub">${t.replace(/</g,'&lt;').replace(/\\n/g,'<br>')}</p>${n?`<p class="sub">教练点评：${n.replace(/</g,'&lt;')}</p>`:''}</div>`,'完成')}
function students(){return `<div class="eyebrow">YOUR PEOPLE · COACH CRM</div><div class="title">了解每位学员，<br>不只看训练数据。</div><input class="field" placeholder="搜索学员姓名或目标…" oninput="filterStudents(this.value)"><div id="studentlist">${studentRows()}</div><div class="head"><h2>待跟进</h2><span class="tag">2 ITEMS</span></div><div class="card flex"><div class="ico">♡</div><div class="grow"><h3>周子墨 · 近期未打卡</h3><p class="sub">主动关怀，确认本周计划。</p></div><button class="link" onclick="toast('已发送模拟消息')">联系</button></div>`}
function studentRows(q=''){return [['陈佳宁','上肢力量 · 本周训练 3 次',84],['周子墨','体态改善 · 本周训练 1 次',42],['许一诺','臀腿力量 · 本周训练 4 次',91]].filter(x=>!q||x.join('').includes(q)).map(x=>`<div class="card flex"><div class="ico">${x[0][0]}</div><div class="grow"><h3>${x[0]}</h3><p class="sub">${x[1]}</p><div class="progress" style="margin-top:7px"><i style="width:${x[2]}%"></i></div></div><span class="tag">${x[2]}%</span></div>`).join('')}
function filterStudents(q){document.querySelector('#studentlist').innerHTML=studentRows(q)}
render();
</script></body></html>
