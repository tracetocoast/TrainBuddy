<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>练搭子 · 最小运营后台</title>
  <style>
    :root {
      --bg: #f4f5f0;
      --card: #fff;
      --ink: #1a1f16;
      --muted: #5c6654;
      --line: #d8ddd0;
      --accent: #2f6b3a;
      --danger: #9b2c2c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Noto Sans SC", sans-serif;
      background: linear-gradient(160deg, #eef1e6, #f7f8f3 40%, #e8ece2);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 8px 24px rgba(26, 31, 22, 0.04);
    }
    label { display: block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    button {
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font: inherit;
    }
    button.secondary { background: #3d4638; }
    button.danger { background: var(--danger); }
    pre, .list {
      background: #1b2119;
      color: #dce8cf;
      padding: 12px;
      border-radius: 10px;
      overflow: auto;
      font-size: 12px;
      max-height: 320px;
      white-space: pre-wrap;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: end; }
    .row > div { flex: 1; min-width: 140px; }
    .pill {
      display: inline-block;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: #e5efda;
      color: var(--accent);
      margin-left: 8px;
    }
    .warn { color: var(--danger); font-size: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>练搭子 · 最小运营后台<span class="pill">OPS</span></h1>
  <p class="sub">账号、教练审核、权益、任务和通知。支付默认关闭，不模拟真实付款成功。</p>

  <div class="card" style="margin-bottom:16px">
    <div class="row">
      <div>
        <label>API Base</label>
        <input id="base" value="/api/v1" />
      </div>
      <div>
        <label>Session Token（ops_admin 登录后粘贴）</label>
        <input id="token" placeholder="Bearer 后的 token" />
      </div>
      <div>
        <button class="secondary" type="button" onclick="loginOps()">一键登录 ops_admin</button>
      </div>
    </div>
    <p class="warn" id="payHint"></p>
  </div>

  <div class="grid">
    <div class="card">
      <strong>账号</strong>
      <button type="button" onclick="loadAccounts()">刷新账号</button>
      <div id="accountList" class="list">尚未加载</div>
      <label>用户 ID</label>
      <input id="accountUser" value="u_stu_001" />
      <label>工单号</label>
      <input id="ticketAccount" value="TKT-ACC-001" />
      <label>理由</label>
      <input id="reasonAccount" value="账号异常" />
      <button class="danger" type="button" onclick="disableAccount()">停用</button>
      <button class="secondary" type="button" onclick="enableAccount()">启用</button>
    </div>

    <div class="card">
      <strong>教练审核</strong>
      <button type="button" onclick="loadCoachApplications()">刷新待审</button>
      <div id="coachList" class="list">尚未加载</div>
      <label>用户 ID</label>
      <input id="coachUser" />
      <label>工单号</label>
      <input id="ticketCoach" value="TKT-COACH-001" />
      <label>理由</label>
      <input id="reasonCoach" value="资料已核对" />
      <button type="button" onclick="reviewCoach('approve')">通过</button>
      <button class="danger" type="button" onclick="reviewCoach('reject')">拒绝</button>
    </div>

    <div class="card">
      <strong>试用／额度补偿</strong>
      <label>工单号</label>
      <input id="ticket" value="TKT-DEMO-001" />
      <label>用户 ID</label>
      <input id="userId" value="u_stu_001" />
      <label>功能</label>
      <select id="feature">
        <option value="posture_scan">posture_scan</option>
        <option value="goal_image">goal_image</option>
        <option value="voice_structure">voice_structure</option>
      </select>
      <label>数量</label>
      <input id="amount" type="number" value="3" />
      <label>理由</label>
      <input id="reason" value="试点补偿" />
      <button type="button" onclick="grant()">发放额度</button>
      <button class="secondary" type="button" onclick="grantTrial()">发放试用包</button>
      <button class="secondary" type="button" onclick="loadEntitlements()">查看该用户权益</button>
    </div>

    <div class="card">
      <strong>订阅到期（AC34 验证）</strong>
      <label>工单号</label>
      <input id="ticketExpire" value="TKT-EXP-001" />
      <label>用户 ID</label>
      <input id="expireUser" value="u_stu_001" />
      <button class="danger" type="button" onclick="expireSub()">标记订阅到期</button>
      <p class="warn">到期后历史仍可读；新付费 AI 任务应被拒绝。</p>
    </div>

    <div class="card">
      <strong>任务</strong>
      <button type="button" onclick="loadTasks()">刷新任务</button>
      <div id="taskList" class="list">尚未加载</div>
      <label>任务 ID</label>
      <input id="taskId" />
      <label>工单号</label>
      <input id="ticketTask" value="TKT-TASK-001" />
      <label>理由</label>
      <input id="reasonTask" value="人工重试" />
      <button class="secondary" type="button" onclick="retryTask()">重试任务</button>
    </div>

    <div class="card">
      <strong>通知</strong>
      <label>用户 ID</label>
      <input id="noticeUser" value="u_stu_001" />
      <button type="button" onclick="loadNotifications()">查看站内通知</button>
      <div id="noticeList" class="list">尚未加载</div>
      <button type="button" onclick="loadOutbox()">刷新失败队列</button>
      <label>Outbox ID（重试）</label>
      <input id="outboxId" />
      <label>工单号</label>
      <input id="ticketOutbox" value="TKT-OBX-001" />
      <button class="secondary" type="button" onclick="retryOutbox()">重试投递</button>
    </div>

    <div class="card">
      <strong>积分与兑换</strong>
      <button type="button" onclick="loadPointRules()">刷新规则</button>
      <div id="pointRules" class="list">尚未加载</div>
      <label>补偿用户 ID</label>
      <input id="pointUser" value="u_stu_001" />
      <label>增减分值</label>
      <input id="pointDelta" type="number" value="5" />
      <label>工单号</label>
      <input id="ticketPoints" value="TKT-PTS-001" />
      <label>理由</label>
      <input id="reasonPoints" value="人工补偿" />
      <button type="button" onclick="adjustPoints()">记一笔补偿</button>
      <button class="secondary" type="button" onclick="loadRewardCatalog()">查看商品</button>
      <button class="secondary" type="button" onclick="loadHeldOrders()">查看待核验订单</button>
      <label>订单 ID</label>
      <input id="redeemOrder" />
      <button class="secondary" type="button" onclick="retryRedeem()">重试履约</button>
    </div>

    <div class="card">
      <strong>支付状态</strong>
      <button type="button" onclick="payStatus()">查看开关</button>
      <button class="danger" type="button" onclick="tryCheckout()">尝试 checkout（应拒绝或未接入）</button>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <strong>响应</strong>
    <pre id="out">{}</pre>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    function headers() {
      const h = { 'Content-Type': 'application/json' }
      const t = $('token').value.trim()
      if (t) h.Authorization = 'Bearer ' + t
      return h
    }
    function show(data) {
      $('out').textContent = JSON.stringify(data, null, 2)
    }
    async function api(method, path, body) {
      const res = await fetch($('base').value.replace(/\/$/, '') + path, {
        method,
        headers: headers(),
        body: body ? JSON.stringify(body) : undefined
      })
      const json = await res.json().catch(() => ({}))
      show({ status: res.status, body: json })
      return { status: res.status, body: json }
    }
    async function loginOps() {
      const r = await api('POST', '/auth/wechat-session', { accountKey: 'ops_admin' })
      if (r.body && r.body.data && r.body.data.sessionToken) {
        $('token').value = r.body.data.sessionToken
      }
      payStatus()
    }
    async function grant() {
      await api('POST', '/admin/entitlements/grant', {
        ticket_id: $('ticket').value,
        user_id: $('userId').value,
        feature: $('feature').value,
        amount: Number($('amount').value),
        reason: $('reason').value
      })
    }
    async function grantTrial() {
      await api('POST', '/admin/entitlements/trial', {
        ticket_id: $('ticket').value,
        user_id: $('userId').value,
        reason: $('reason').value
      })
    }
    async function loadEntitlements() {
      await api('GET', '/admin/entitlements?user_id=' + encodeURIComponent($('userId').value.trim()))
    }
    function lines(id, text) {
      $(id).textContent = text || '暂无'
    }
    async function loadAccounts() {
      const r = await api('GET', '/admin/accounts')
      const list = (r.body && r.body.data) || []
      lines(
        'accountList',
        list
          .map((row) =>
            [row.user_id, row.display_name, row.status, (row.roles || []).join('/'), row.coach_approval_status || '-'].join(' · ')
          )
          .join('\n')
      )
      if (list[0] && !$('accountUser').value) $('accountUser').value = list[0].user_id
    }
    async function disableAccount() {
      await api('POST', '/admin/accounts/disable', {
        ticket_id: $('ticketAccount').value,
        user_id: $('accountUser').value.trim(),
        reason: $('reasonAccount').value
      })
      loadAccounts()
    }
    async function enableAccount() {
      await api('POST', '/admin/accounts/enable', {
        ticket_id: $('ticketAccount').value,
        user_id: $('accountUser').value.trim(),
        reason: $('reasonAccount').value
      })
      loadAccounts()
    }
    async function loadCoachApplications() {
      const r = await api('GET', '/admin/coach-applications?status=pending')
      const list = (r.body && r.body.data) || []
      lines(
        'coachList',
        list.map((row) => [row.user_id, row.display_name, row.approval_status].join(' · ')).join('\n')
      )
      if (list[0]) $('coachUser').value = list[0].user_id
    }
    async function reviewCoach(decision) {
      await api('POST', '/admin/coach-reviews', {
        ticket_id: $('ticketCoach').value,
        user_id: $('coachUser').value.trim(),
        decision,
        reason: $('reasonCoach').value
      })
      loadCoachApplications()
    }
    async function loadTasks() {
      const r = await api('GET', '/admin/ai-tasks')
      const list = (r.body && r.body.data) || []
      lines(
        'taskList',
        list.map((row) => [row.task_id, row.type, row.status, row.owner_id].join(' · ')).join('\n')
      )
      if (list[0]) $('taskId').value = list[0].task_id
    }
    async function retryTask() {
      await api('POST', '/admin/ai-tasks/' + encodeURIComponent($('taskId').value.trim()) + '/retry', {
        ticket_id: $('ticketTask').value,
        reason: $('reasonTask').value
      })
    }
    async function loadNotifications() {
      const r = await api(
        'GET',
        '/admin/notifications?user_id=' + encodeURIComponent($('noticeUser').value.trim())
      )
      const list = (r.body && r.body.data) || []
      lines(
        'noticeList',
        list.map((row) => [row.id, row.title, row.body].join(' · ')).join('\n')
      )
    }
    async function expireSub() {
      await api('POST', '/admin/subscriptions/expire', {
        ticket_id: $('ticketExpire').value,
        user_id: $('expireUser').value,
        reason: '试点验证 AC34'
      })
    }
    async function loadOutbox() {
      const r = await api('GET', '/admin/outbox?status=failed')
      const list = (r.body && r.body.data) || []
      if (list[0]) $('outboxId').value = list[0].outbox_id
    }
    async function retryOutbox() {
      await api('POST', '/admin/outbox/' + $('outboxId').value + '/retry', {
        ticket_id: $('ticketOutbox').value,
        reason: '人工重试投递'
      })
    }
    async function payStatus() {
      const r = await api('GET', '/payments/status')
      const d = r.body && r.body.data
      $('payHint').textContent = d
        ? (d.payment_enabled ? '支付开关：开（仍未接入渠道）' : '支付开关：关 — 不开放真实付款')
        : ''
    }
    async function tryCheckout() {
      await api('POST', '/payments/checkout', { sku: 'posture_pack_3' })
    }
    async function loadPointRules() {
      const r = await api('GET', '/admin/points/rules')
      lines('pointRules', JSON.stringify((r.body && r.body.data) || {}, null, 2))
    }
    async function adjustPoints() {
      await api('POST', '/admin/points/adjustments', {
        ticket_id: $('ticketPoints').value,
        user_id: $('pointUser').value.trim(),
        delta: Number($('pointDelta').value),
        reason: $('reasonPoints').value
      })
    }
    async function loadRewardCatalog() {
      const r = await api('GET', '/admin/rewards')
      const list = (r.body && r.body.data) || []
      lines('pointRules', list.map((row) => [row.sku, row.points_price, row.enabled ? '上架' : '下架'].join(' · ')).join('\n'))
    }
    async function loadHeldOrders() {
      const r = await api('GET', '/admin/redemptions?status=needs_review')
      const list = (r.body && r.body.data) || []
      lines('pointRules', list.map((row) => [row.order_id, row.sku, row.status].join(' · ')).join('\n'))
      if (list[0]) $('redeemOrder').value = list[0].order_id
    }
    async function retryRedeem() {
      await api('POST', '/admin/redemptions/' + encodeURIComponent($('redeemOrder').value.trim()) + '/retry', {
        ticket_id: $('ticketPoints').value,
        reason: $('reasonPoints').value
      })
    }
  </script>
</body>
</html>
