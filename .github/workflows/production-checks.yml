name: Production preparation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test
          POSTGRES_DB: trainbuddy_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: server/package-lock.json }
      - run: npm ci --ignore-scripts
        working-directory: server
      - run: node scripts/build-miniprogram-config.js
      - run: npm test
        working-directory: server
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-test@localhost:5432/trainbuddy_test
      - run: node server/scripts/scan-secrets.js --history
      - run: sh -n deploy/init-db.sh && sh -n deploy/backup-once.sh && sh -n deploy/backup-loop.sh
      - run: docker run --rm -e API_DOMAIN=api.example.com -e ACME_EMAIL=ci@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile
      - run: node server/scripts/ci-compose-smoke.js
        timeout-minutes: 15
